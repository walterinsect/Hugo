# Obsidian のリポジトリで publish: true にしたノートを、記事として取り込む（毎時 17 分）。
# 手順の説明は docs/obsidian-publishing.md を参照。
name: Sync Obsidian posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # 取り込んだ記事を main にコミットする
  actions: write # 取り込み後にサイトの公開（hugo.yaml）を起動する

concurrency:
  group: obsidian-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          ref: main

      # 非公開のリポジトリを読むには OBSIDIAN_REPO_TOKEN（読み取り専用のトークン）が必要
      - name: Checkout Obsidian vault
        uses: actions/checkout@v4
        with:
          repository: walterinsect/Obsidian
          path: vault
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0 # 更新日を履歴から取る（ファイルの中身は必要な分だけ取得）
          filter: blob:none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install "pyyaml>=6,<7" "pillow>=10"

      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Convert notes
        id: sync
        run: python scripts/obsidian_sync.py --vault vault --site .

      # 変換した結果でサイトを作れない場合は、コミットせずに止める
      - name: Build check
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: hugo --gc --minify --destination "${RUNNER_TEMP}/site-check"

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content scripts/obsidian_sync_state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更はありません"
            exit 0
          fi
          git commit -m "Sync posts from Obsidian"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::main への push に失敗しました"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN での push は、push をきっかけにしたワークフローを起動しないので、公開を直接起動する
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yaml --ref main

      # 変換できなかったノートがあるときは、他のノートを反映したうえで失敗にして知らせる
      - name: Report note errors
        if: steps.sync.outputs.errors != '0'
        run: |
          echo "::error::公開できなかったノートがあります。実行の Summary に一覧があります。"
          exit 1
