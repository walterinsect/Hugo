baseURL = 'https://wyamazaki.fi/'
locale = 'ja-JP'
defaultContentLanguage = 'ja'
# 日付だけの記事も、URL の年月日を日本時間で決める
timeZone = 'Asia/Tokyo'
title = '極度乾燥しなさい3.0'

# 記事の URL を WordPress の旧 URL（日付と記事名）と同じ形にする
[permalinks.page]
  posts = '/:year/:month/:day/:slug/'

[module]
  [[module.imports]]
    path = "github.com/nanxiaobei/hugo-paper"

[params]
  # トップページの記事一覧にはブログ記事だけを出す
  mainSections = ['posts']
  # トップページのプロフィール
  name = 'walterinsect'
  # 空にするとテーマ既定の「A personal blog by …」が出るので、空白 1 文字で名前だけにする
  bio = ' '
  # ヘッダーの SNS アイコン（X）
  twitter = 'walterinsect'
  flickr = 'https://www.flickr.com/photos/walterinsect/'

[menus]
  [[menus.main]]
    name = 'Blog'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 15
  [[menus.main]]
    name = 'About'
    url = '/about-2/'
    weight = 17
  [[menus.main]]
    name = 'About (EN)'
    url = '/en/about/'
    weight = 18
  [[menus.main]]
    name = 'Photos'
    pageRef = '/photos'
    weight = 20

# 記事中の <br> などの HTML をそのまま出力する
[markup.goldmark.renderer]
  unsafe = true
